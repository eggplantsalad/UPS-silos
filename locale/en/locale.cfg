[technology-name]
ups-silo-tech=Unified Production Supply Silos

[technology-description]
ups-silo-tech=Unlocks the ability to place platform-spanning, performant silo storage. Consolidates multiple lanes of throughput into unified constant-time buffers to eliminate balancing bottlenecks.

[ups-silo]
# Item-side description (recipe.lua): only the legacy ups-silo-item-v-*
# items use this any more (the horizontal items dropped their own
# description in favor of the entity's, below, once their recipe's
# ingredients started showing the real cost on Factoriopedia directly).
# __1__ = per-slot stack multiplier, __2__ = generic-item cost.
stack-info=Deep-stack silo: 10 slots, each holding __1__x a normal item stack. Costs __2__x [item=ups-silo-generic] to build.

# Entity-side description (data.lua): shown for an already-placed silo or
# its ghost. Same __1__/__2__ substitutions.
stack-info-entity=Deep-stack silo: 10 slots, each holding __1__x a normal item stack. Deconstructs into __2__x [item=ups-silo-generic].
stack-info-entity-1x1=Deep-stack silo: 10 slots, each holding __1__x a normal item stack. Deconstructs into __2__x [item=ups-silo-generic]. Fishermen say this one never quite fills up.

# Name template, referenced via localised_name (size number substituted
# in) from the item, entity, AND recipe prototypes alike, for both the
# current horizontal silos and the legacy/hidden vertical ones - see
# recipe.lua / data.lua. Rotation makes "horizontal" vs "vertical"
# meaningless as a size descriptor, so both just read "N wide".
name-sized=U.P.S. Silo (__1__ wide)

# The 1x1 is a one-off (plain vanilla-styled shared entity, not a
# horizontal/vertical slice) so it doesn't fit the templates above - also
# referenced via an explicit localised_name, same as everything else here.
name-1x1=U.P.S. Silo (1x1)

# The generic remote
name-generic=U.P.S. Silo (drag to size)
stack-info-generic=Drag a 1-tile-tall or 1-tile-wide box the size you want, up to 27. Spends N of these (N = tiles) to build the matching silo - or places a ghost instead if you don't have enough yet.

[item-group-name]
ups-silo-group=U.P.S. Silos
